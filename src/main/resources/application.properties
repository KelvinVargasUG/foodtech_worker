spring.application.name=foodtech_worker
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/foodtech_db
spring.datasource.username=foodtech_user
spring.datasource.password=foodtech_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
foodtech.rabbitmq.queue=foodtech.queue
foodtech.rabbitmq.exchange=foodtech.exchange
foodtech.rabbitmq.routingkey=foodtech.routingkey
foodtech.outbox.max-attempts=10
foodtech.outbox.scheduler-rate=10000
logging.level.com.foodtech.kitchen.worker.foodtech_worker.infrastructure.adapters.input.scheduler=DEBUG

# Configuration for Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ms-factura-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Producer Configuration (JSON Serialization)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Message Broker Strategy Configuration
# Options: 'rabbitmq' (default) or 'kafka'
# Change only this line to switch brokers: foodtech.message-broker=kafka or foodtech.message-broker=rabbitmq
foodtech.message-broker=kafka

# Kafka Topic Configuration (used when message-broker=kafka)
foodtech.kafka.topic=create-factura