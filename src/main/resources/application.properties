# alias: SPRING_APPLICATION_NAME
spring.application.name=${SPRING_APPLICATION_NAME:foodtech_worker}
# alias: SERVER_PORT
server.port=${SERVER_PORT:8081}

# alias: SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodtech_db}
# alias: SPRING_DATASOURCE_USERNAME
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:foodtech_user}
# alias: SPRING_DATASOURCE_PASSWORD
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:foodtech_pass}

# alias: SPRING_JPA_HIBERNATE_DDL_AUTO
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# alias: SPRING_JPA_SHOW_SQL
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
# alias: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# RabbitMQ Configuration
# alias: SPRING_RABBITMQ_HOST
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
# alias: SPRING_RABBITMQ_PORT
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
# alias: SPRING_RABBITMQ_USERNAME
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
# alias: SPRING_RABBITMQ_PASSWORD
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
# alias: FOODTECH_RABBITMQ_QUEUE
foodtech.rabbitmq.queue=${FOODTECH_RABBITMQ_QUEUE:foodtech.queue}
# alias: FOODTECH_RABBITMQ_EXCHANGE
foodtech.rabbitmq.exchange=${FOODTECH_RABBITMQ_EXCHANGE:foodtech.exchange}
# alias: FOODTECH_RABBITMQ_ROUTINGKEY
foodtech.rabbitmq.routingkey=${FOODTECH_RABBITMQ_ROUTINGKEY:foodtech.routingkey}
# alias: FOODTECH_OUTBOX_MAX_ATTEMPTS
foodtech.outbox.max-attempts=${FOODTECH_OUTBOX_MAX_ATTEMPTS:10}
# alias: FOODTECH_OUTBOX_SCHEDULER_RATE
foodtech.outbox.scheduler-rate=${FOODTECH_OUTBOX_SCHEDULER_RATE:10000}
# alias: LOGGING_LEVEL_COM_FOODTECH_KITCHEN_WORKER_FOODTECH_WORKER_INFRASTRUCTURE_ADAPTERS_INPUT_SCHEDULER
logging.level.com.foodtech.kitchen.worker.foodtech_worker.infrastructure.adapters.input.scheduler=${LOGGING_LEVEL_COM_FOODTECH_KITCHEN_WORKER_FOODTECH_WORKER_INFRASTRUCTURE_ADAPTERS_INPUT_SCHEDULER:DEBUG}

# Configuration for Kafka
# alias: SPRING_KAFKA_BOOTSTRAP_SERVERS
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# alias: SPRING_KAFKA_CONSUMER_GROUP_ID
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:ms-factura-group}
# alias: SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET
spring.kafka.consumer.auto-offset-reset=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
# alias: SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER
spring.kafka.consumer.key-deserializer=${SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
# alias: SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER
spring.kafka.consumer.value-deserializer=${SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER:org.springframework.kafka.support.serializer.JsonDeserializer}
# alias: SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES
spring.kafka.consumer.properties.spring.json.trusted.packages=${SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES:*}

# Kafka Producer Configuration (JSON Serialization)
# alias: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
spring.kafka.producer.key-serializer=${SPRING_KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
# alias: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
spring.kafka.producer.value-serializer=${SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER:org.springframework.kafka.support.serializer.JsonSerializer}
# alias: SPRING_KAFKA_PRODUCER_PROPERTIES_SPRING_JSON_ADD_TYPE_HEADERS
spring.kafka.producer.properties.spring.json.add.type.headers=${SPRING_KAFKA_PRODUCER_PROPERTIES_SPRING_JSON_ADD_TYPE_HEADERS:false}

# Message Broker Strategy Configuration
# Options: 'rabbitmq' (default) or 'kafka'
# Change only this line to switch brokers: foodtech.message-broker=kafka or foodtech.message-broker=rabbitmq
# alias: FOODTECH_MESSAGE_BROKER
foodtech.message-broker=${FOODTECH_MESSAGE_BROKER:kafka}

# Kafka Topic Configuration (used when message-broker=kafka)
# alias: FOODTECH_KAFKA_TOPIC
foodtech.kafka.topic=${FOODTECH_KAFKA_TOPIC:foodtech.factura.created}